# Automatische controle bij elke pull request.
#
# Waarom dit bestand bestaat: sinds Next.js 16 kijkt `next build` de lint niet
# meer na (zie node_modules/next/dist/docs/01-app/02-guides/upgrading/version-16.md:
# "The `next lint` command has been removed. ... `next build` no longer runs
# linting."). De Vercel-build blijft dus groen bij lintfouten. Deze workflow
# vult dat gat.
#
# Bouwen doet Vercel al bij elke pull request; dat herhalen we hier niet.
name: Controle

on:
  pull_request:
  push:
    branches: [main]

# Eén tak hoeft maar één keer tegelijk gecontroleerd te worden: duw je snel
# achter elkaar, dan stopt de oude run.
concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-en-typecontrole:
    name: Lint en typecontrole
    runs-on: ubuntu-latest
    # Normaal is deze job in ruim een minuut klaar. Blijft er iets hangen, dan
    # kappen we er na drie minuten mee in plaats van zes uur te wachten.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 (huidige LTS). Niet lager: package-lock.json is door npm 11
          # geschreven en npm 10 (dat bij Node 22 zit) weigert hem met
          # "Missing: @swc/helpers@0.5.23 from lock file". Dat komt doordat
          # next@16.2.4 @swc/helpers zowel als afhankelijkheid 0.5.15 als als
          # losse eis ">=0.5.17" opgeeft; alleen npm 11 lost dat op.
          node-version: 24
          cache: npm

      - name: Pakketten installeren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecontrole
        run: npm run typecheck

  # Loopt de weg van een leerling na in een echte browser: inloggen →
  # oefenen → antwoord nakijken → voortgang op het dashboard. Alles lokaal:
  # een wegwerp-Supabase in Docker en een neppe AI-controle, zodat deze
  # controle nooit aan de gedeelde database of aan Gemini komt.
  e2e:
    name: Weg van een leerling
    runs-on: ubuntu-latest
    # Normaal duurt deze job twee à drie minuten. Hangt er een stap (dat
    # gebeurde: het installeren van de browser bleef 17 minuten staan), dan
    # stopt GitHub er na tien minuten mee in plaats van na zes uur.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Zelfde reden als hierboven: npm 11 is nodig voor package-lock.json.
          node-version: 24
          cache: npm

      # Verandert er in een pull request alleen tekst (README, docs, bronnen
      # voor de oefenstof), dan hoeft de browser er niet doorheen. De job
      # blijft wel bestaan en eindigt groen: hij is verplicht op `main`, en
      # een job die helemaal niet draait blijft daar op "in afwachting"
      # staan.
      - name: Kijken of de tests nodig zijn
        id: nodig
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Geen pull request: altijd nalopen."
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASIS"
          gewijzigd=$(git diff --name-only "$BASIS" HEAD)
          echo "Gewijzigde bestanden:"
          echo "$gewijzigd"

          if [ -z "$gewijzigd" ]; then
            echo "Geen lijst met wijzigingen: voor de zekerheid toch nalopen."
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Blijft er na de tekstbestanden iets over, dan moet de browser erdoor.
          rest=$(printf '%s\n' "$gewijzigd" | grep -vE '(\.md$|^docs/|^content-bron/)' || true)
          if [ -n "$rest" ]; then
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
          else
            echo "draaien=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: Overgeslagen
        if: ${{ steps.nodig.outputs.draaien != 'ja' }}
        run: echo "Alleen tekst gewijzigd — de weg van een leerling blijft hetzelfde."

      - name: Pakketten installeren
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        run: npm ci

      # De browser (± 100 MB) hoeft niet bij elke run opnieuw gedownload te
      # worden. De sleutel is de Playwright-versie uit package-lock.json:
      # bij elke nieuwe versie hoort een nieuwe browser.
      - name: Playwright-versie opzoeken
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        id: playwright
        run: |
          versie=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "versie=$versie" >> "$GITHUB_OUTPUT"

      - name: Bewaarde browser terughalen
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        id: browser-opslag
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versie }}

      # Stond de browser er al, dan hoeven alleen de systeembibliotheken nog.
      # Mislukt het of blijft het hangen, dan proberen we het één keer
      # opnieuw: dat is meestal een hapering bij de download.
      - name: Browser installeren
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        timeout-minutes: 3
        env:
          UIT_OPSLAG: ${{ steps.browser-opslag.outputs.cache-hit }}
        run: |
          installeren() {
            if [ "$UIT_OPSLAG" = "true" ]; then
              timeout 80 npx playwright install-deps chromium
            else
              timeout 80 npx playwright install --with-deps chromium
            fi
          }
          installeren || {
            echo "::warning::Installeren van de browser mislukte of liep vast; nog één poging."
            installeren
          }

      # Alleen wat de test nodig heeft: de database, inloggen (auth) en de
      # data-API. De rest (studio, opslag, mail, realtime, edge-functies,
      # statistieken) gebruikt de site niet in deze test en kost vooral tijd
      # met het ophalen van containers.
      - name: Lokale Supabase starten
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        timeout-minutes: 4
        run: >
          npx supabase start -x
          studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Weg van een leerling nalopen
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        timeout-minutes: 5
        run: npm run test:e2e

      - name: Uitslag bewaren
        if: ${{ !cancelled() && steps.nodig.outputs.draaien == 'ja' }}
        uses: actions/upload-artifact@v4
        with:
          name: uitslag-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
