# Automatische controle bij elke pull request.
#
# Waarom dit bestand bestaat: sinds Next.js 16 kijkt `next build` de lint niet
# meer na (zie node_modules/next/dist/docs/01-app/02-guides/upgrading/version-16.md:
# "The `next lint` command has been removed. ... `next build` no longer runs
# linting."). Deze workflow vult dat gat.
#
# Botst de pull request met zijn doeltak, dan maakt GitHub de samengevoegde
# versie (refs/pull/<nummer>/merge) niet aan en start deze workflow helemaal
# niet. De checks hieronder blijven dan weg: niet rood, gewoon afwezig. De
# workflow botst-met-doeltak.yml draait op de tak zelf en wordt in dat geval
# rood.
#
# Deze controle draait ook bij een push op `main`. Dat is geen dubbel werk:
# een squash-merge maakt een nieuwe commit die nog niemand getest heeft, en
# de verplichte checks horen op die commit te staan.
#
# De live site is de Cloudflare Worker `afgeleide-oefenen`. Workers Builds
# bouwt elke pull request en zet `main` live. De Workers-bouw hier is dezelfde
# bouw, zodat een pull request die Cloudflare breekt rood wordt nog voordat
# die controle van Cloudflare binnen is. Die job is nog geen verplichte
# controle op main.
name: Controle

on:
  pull_request:
  push:
    branches: [main]
  # Met de hand, als de checks op een commit ontbreken:
  #   gh workflow run controle.yml --ref main
  workflow_dispatch:

# Eén tak hoeft maar één keer tegelijk gecontroleerd te worden: duw je snel
# achter elkaar, dan stopt de oude run.
concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-en-typecontrole:
    # Deze naam niet veranderen: de ruleset "main beschermen" eist een
    # geslaagde check met precies deze naam. Hernoem je de job, dan blijft die
    # check eeuwig op "in afwachting" staan en kan geen pull request meer
    # gemergd worden. De job doet meer dan de naam zegt: zie de stappen.
    name: Lint en typecontrole
    runs-on: ubuntu-latest
    # Normaal is deze job in ruim een minuut klaar. Blijft er iets hangen, dan
    # kappen we er na drie minuten mee in plaats van zes uur te wachten.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # De Node-versie staat in .nvmrc, zodat deze controle, `nvm use` en
          # `engines.node` in package.json niet uit elkaar kunnen lopen. Lager
          # dan 24 kan niet: package-lock.json is door npm 11 geschreven en
          # npm 10 (dat bij Node 22 zit) weigert hem met "Missing:
          # @swc/helpers@0.5.23 from lock file" — zie README, "Node 24 of
          # nieuwer".
          node-version-file: .nvmrc
          cache: npm

      # Gebruikt alleen node:fs, dus dit kan al vóór `npm ci`. Vangt af dat
      # twee pull requests die los van elkaar vertakt zijn, allebei dezelfde
      # migratie-nummer kiezen: geen git-conflict (verschillende
      # bestandsnamen), dus "Botst met de doeltak" ziet dit niet, en pas het
      # registreren op de echte database zou botsen (AFG-644).
      - name: Migratienummers controleren
        run: node scripts/controleer-migratienummers.mjs

      - name: Pakketten installeren
        run: npm ci

      # `npm run lint` staat op `--max-warnings=0`: ook een waarschuwing laat
      # deze stap vallen. Zonder die drempel stapelen waarschuwingen zich op
      # tot niemand ze meer leest — dat gebeurde al een keer (veertien stuks).
      # Een waarschuwing die echt moet blijven, zet je met een `eslint-disable`
      # en een reden erbij uit, zodat te zien is waarom.
      - name: Lint
        run: npm run lint

      - name: Typecontrole
        run: npm run typecheck

      # De rekenregels: pure functies, geen browser, geen database en geen
      # Gemini. Er zijn dus geen sleutels voor nodig en het kost een seconde
      # of twee. Zonder deze stap komt een pull request die het nakijken van
      # antwoorden stukmaakt gewoon groen door de controle.
      - name: Rekenregels
        run: npm test

  # Dezelfde site, gebouwd voor Cloudflare Workers. De live site is deze bouw.
  workers:
    name: Bouw voor Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pakketten installeren
        run: npm ci

      # NEXT_PUBLIC_*-waarden worden tijdens de bouw ingebakken; de echte
      # staan bij Workers Builds. Hier zijn het nepwaarden, want deze stap
      # praat niet echt met Supabase — zie de rooktest hieronder.
      - name: Bouw voor Cloudflare Workers
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://rooktest.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: rooktest
          NEXT_PUBLIC_SITE_URL: http://localhost:3177

      # AFG-564: de Workers-bouw kan slagen terwijl de site op Cloudflare
      # zelf 500 geeft op elke pagina die niet statisch is — dat zag deze
      # controle hiervoor niet, want hij start de bouw nooit op. Dit haalt
      # een echte server-pagina op uit de net gebouwde worker.
      - name: Rooktest van de Workers-bouw
        run: |
          npx opennextjs-cloudflare preview --port 3177 &
          preview_pid=$!
          trap "kill $preview_pid" EXIT

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3177/nl/inloggen || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done

          echo "GET /nl/inloggen -> $code"
          if [ "$code" != "200" ]; then
            echo "Verwachtte 200, kreeg $code. Zie de foutmelding van wrangler hierboven."
            exit 1
          fi

  # Loopt de weg van een leerling na in een echte browser: inloggen →
  # oefenen → antwoord nakijken → voortgang op het dashboard. Alles lokaal:
  # een wegwerp-Supabase in Docker en een neppe AI-controle, zodat deze
  # controle nooit aan de productiedatabase of aan Gemini komt.
  #
  # De tests zijn over drie machines verdeeld (AFG-491). Achter elkaar op één
  # machine duurden ze 9 minuten en 56 seconden, met een grens van tien: één
  # test die een tweede poging nodig had, liet de hele stap omvallen terwijl
  # er niets stuk was.
  #
  # Waarom drie machines en niet drie browsers naast elkaar op één machine:
  # dat laatste is geprobeerd en het hielp nauwelijks. Een runner heeft vier
  # kernen, en die zitten al vol met de ontwikkelserver van Next plus één
  # browser. Vier browsers tegelijk maakte elke losse test drie keer zo
  # langzaam en leverde onder de twintig procent tijdwinst op. Meer kernen is
  # hier het enige dat helpt, en die komen van een extra machine.
  #
  # Playwright verdeelt met `--shard` per testbestand, niet per test: tests
  # uit hetzelfde bestand blijven bij elkaar zolang `fullyParallel` uit staat.
  # Dat is nodig, want ze delen de testleerling uit de seed. Elk deel heeft
  # bovendien zijn eigen wegwerp-Supabase, dus twee delen kunnen elkaar
  # sowieso niet in de weg zitten.
  #
  # De naam van deze job heeft een nummer en is dus NIET de verplichte check.
  # Dat is de job `e2e` hieronder, die op deze wacht.
  e2e-deel:
    name: Weg van een leerling (deel ${{ matrix.deel }})
    runs-on: ubuntu-latest
    strategy:
      # Valt deel 2 om, dan wil je deel 1 en 3 nog steeds zien: anders weet je
      # niet of het aan je wijziging ligt of aan die ene test.
      fail-fast: false
      matrix:
        deel: [1, 2, 3]
    # Normaal duurt deze job een minuut of zes. Hangt er een stap (dat
    # gebeurde: het installeren van de browser bleef 17 minuten staan), dan
    # stopt GitHub er hier mee in plaats van na zes uur. Ruim genoeg dat ook
    # een tweede poging bij "Browser installeren" nog af kan maken: wordt die
    # door de job afgekapt, dan staat de controle alsnog op rood en moet hij
    # met de hand opnieuw.
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Zelfde reden als hierboven: npm 11 is nodig voor package-lock.json.
          node-version-file: .nvmrc
          cache: npm

      # Verandert er in een pull request alleen tekst (README, docs, bronnen
      # voor de oefenstof), dan hoeft de browser er niet doorheen. De job
      # blijft wel bestaan en eindigt groen: hij is verplicht op `main`, en
      # een job die helemaal niet draait blijft daar op "in afwachting"
      # staan.
      - name: Kijken of de tests nodig zijn
        id: nodig
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Geen pull request: altijd nalopen."
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASIS"
          gewijzigd=$(git diff --name-only "$BASIS" HEAD)
          echo "Gewijzigde bestanden:"
          echo "$gewijzigd"

          if [ -z "$gewijzigd" ]; then
            echo "Geen lijst met wijzigingen: voor de zekerheid toch nalopen."
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Blijft er na de tekstbestanden iets over, dan moet de browser erdoor.
          rest=$(printf '%s\n' "$gewijzigd" | grep -vE '(\.md$|^docs/|^content-bron/)' || true)
          if [ -n "$rest" ]; then
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
          else
            echo "draaien=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: Overgeslagen
        if: ${{ steps.nodig.outputs.draaien != 'ja' }}
        run: echo "Alleen tekst gewijzigd — de weg van een leerling blijft hetzelfde."

      - name: Pakketten installeren
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        run: npm ci

      # De browser (± 100 MB) hoeft niet bij elke run opnieuw gedownload te
      # worden. De sleutel is de Playwright-versie uit package-lock.json:
      # bij elke nieuwe versie hoort een nieuwe browser.
      - name: Playwright-versie opzoeken
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        id: playwright
        run: |
          versie=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "versie=$versie" >> "$GITHUB_OUTPUT"

      - name: Bewaarde browser terughalen
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        id: browser-opslag
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versie }}

      # Stond de browser er al, dan hoeven alleen de systeembibliotheken nog.
      # Mislukt het of blijft het hangen, dan proberen we het één keer
      # opnieuw: dat is meestal een hapering bij de download.
      #
      # Twee dingen om te weten voor je hier aan de getallen draait:
      #
      # 1. De grens per poging stond op 80 seconden. Dat is te krap: haalt
      #    apt-get de lettertypen bij een trage mirror op, dan is een poging
      #    die gewoon nog bezig is al voor vastgelopen aangezien. Vier
      #    minuten is ruim genoeg voor een langzame ronde en nog steeds kort
      #    genoeg om een echte hangende stap af te kappen.
      # 2. `timeout` kan de apt-get van een afgekapte poging niet
      #    meenemen. Playwright start die via sudo, dus als root, en een
      #    proces van de runner mag root geen signaal sturen: die apt-get
      #    loopt door. De tweede poging struikelde daardoor over "Could not
      #    get lock /var/lib/dpkg/lock-frontend" en liet de hele job vallen.
      #    Met DPkg::Lock::Timeout wacht apt-get netjes tot het slot vrij is
      #    in plaats van er meteen mee te stoppen.
      - name: Browser installeren
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        timeout-minutes: 9
        env:
          UIT_OPSLAG: ${{ steps.browser-opslag.outputs.cache-hit }}
        run: |
          echo 'DPkg::Lock::Timeout "120";' \
            | sudo tee /etc/apt/apt.conf.d/99-wacht-op-dpkg-slot > /dev/null

          installeren() {
            if [ "$UIT_OPSLAG" = "true" ]; then
              timeout --kill-after=15 240 npx playwright install-deps chromium
            else
              timeout --kill-after=15 240 npx playwright install --with-deps chromium
            fi
          }

          installeren || {
            code=$?
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "::warning::Installeren van de browser duurde langer dan vier minuten; nog één poging."
            else
              echo "::warning::Installeren van de browser mislukte (afsluitcode $code); nog één poging."
            fi
            installeren
          }

      # Alleen wat de test nodig heeft: de database, inloggen (auth), de
      # data-API en de testpostbus (Mailpit). Die postbus is er sinds
      # AFG-108 bij: de test maakt de bevestigingsmail en de resetmail echt
      # open. De rest (studio, opslag, realtime, edge-functies, statistieken)
      # gebruikt de site niet in deze test. Het scriptje zet ze in de config
      # uit; dat scheelt meer dan `start -x`, want uitgezette onderdelen
      # worden ook niet gedownload. De config van je eigen computer blijft
      # ongemoeid: dit draait alleen hier.
      #
      # De beelden komen eerst van ghcr.io, het register van GitHub zelf.
      # public.ecr.aws weigert pulls vanaf deze runners ("toomanyrequests:
      # Rate exceeded", soms "Data limit exceeded"): de runners delen één
      # uitgaand adres en dat register telt anonieme pulls heel krap.
      # De CLI probeert dat register eerst en valt pas daarna terug. Die
      # eerste pogingen kunnen de vier minuten van deze stap opmaken,
      # waarna de tests niet eens starten. Mislukt het ophalen via ghcr,
      # dan één keer de gewone volgorde. Een fout in een migratie is geen
      # ophaalfout en krijgt die tweede poging niet.
      - name: Lokale Supabase starten
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        timeout-minutes: 4
        run: |
          node scripts/ci-supabase-kaal.mjs
          log=$(mktemp)
          starten() {
            npx supabase start -x imgproxy,postgres-meta 2>&1 | tee "$log"
            return "${PIPESTATUS[0]}"
          }

          code=0
          SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io starten || code=$?
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if grep -qE 'toomanyrequests|Rate exceeded|Data limit exceeded|manifest unknown|failed to pull docker image' "$log"; then
            echo "::warning::Ophalen via ghcr.io liep vast; nog een keer via de gewone registers."
            starten
            exit $?
          fi
          exit "$code"

      # Een derde van de tests. Welke derde bepaalt Playwright zelf; de
      # verdeling gaat op aantal tests, dus niet elk deel duurt even lang.
      #
      # Draai je aan deze grens: kijk eerst hoe lang de stap de laatste keren
      # echt duurde. Hij hoort ruim boven die tijd te liggen, zodat een tweede
      # poging er nog bij kan, en ruim eronder te blijven, zodat een suite die
      # stilletjes verdubbelt opvalt in plaats van stilletjes door te groeien.
      - name: Weg van een leerling nalopen
        if: ${{ steps.nodig.outputs.draaien == 'ja' }}
        timeout-minutes: 8
        run: npm run test:e2e -- --shard=${{ matrix.deel }}/3

      - name: Uitslag bewaren
        if: ${{ !cancelled() && steps.nodig.outputs.draaien == 'ja' }}
        uses: actions/upload-artifact@v4
        with:
          # Een naam per deel: twee delen kunnen niet hetzelfde pakketje
          # neerzetten.
          name: uitslag-e2e-${{ matrix.deel }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # De verplichte check. Deze naam niet veranderen: de ruleset "main
  # beschermen" eist een geslaagde check met precies deze naam. De tests zelf
  # draaien in `e2e-deel` hierboven, en die heet per deel anders — vandaar
  # deze job, die alleen kijkt of ze alle drie geslaagd zijn.
  e2e:
    name: Weg van een leerling
    needs: e2e-deel
    # Ook draaien als een deel omvalt: anders blijft deze check op "in
    # afwachting" staan en kan er niets meer gemergd worden.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Kijken of alle delen geslaagd zijn
        env:
          UITSLAG: ${{ needs.e2e-deel.result }}
        run: |
          set -euo pipefail
          if [ "$UITSLAG" = "success" ] || [ "$UITSLAG" = "skipped" ]; then
            echo "Alle delen van de weg van een leerling zijn geslaagd."
            exit 0
          fi
          echo "::error::Een deel van de weg van een leerling is niet geslaagd ($UITSLAG). Kijk bij 'Weg van een leerling (deel 1)', '(deel 2)' en '(deel 3)' welk deel het is."
          exit 1
