# Kijkt één keer per dag of het Supabase-dashboard nog hetzelfde zegt als
# supabase/config.toml.
#
# Waarom dit een eigen bestand is en niet een stap in controle.yml: die
# workflow draait bij elke pull request. Deze controle heeft daar niets te
# zoeken — het dashboard verandert niet door een pull request, en elke run
# kost een verbinding met het echte project. Een job met `schedule` erin zou
# bovendien de hele controle.yml elke nacht laten draaien.
#
# Alleen lezen. `supabase config diff` schrijft niets, niet lokaal en niet in
# het dashboard. `supabase config push` staat hier met opzet níét: dat project
# draagt de echte accounts en voortgang van leerlingen.
name: Dashboard vergelijken

on:
  # Elke ochtend om 05:00 UTC — dat is 07:00 Nederlandse tijd in de zomer,
  # 06:00 in de winter. Ruim voor Aaf achter de computer zit.
  schedule:
    - cron: "0 5 * * *"
  # En met de hand, vanaf het tabblad Actions, bijvoorbeeld vlak nadat er iets
  # in het dashboard is veranderd.
  workflow_dispatch:

concurrency:
  group: dashboard-vergelijken
  cancel-in-progress: false

permissions:
  contents: read
  # Nodig om de melding hieronder als issue te openen, bij te werken en weer
  # te sluiten.
  issues: write

jobs:
  vergelijken:
    name: Dashboard vergelijken met config.toml
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # De titel waaraan de melding te herkennen is. Verander je hem, dan
      # vindt de volgende run de openstaande melding niet meer terug en komt
      # er een tweede bij.
      TITEL: "Het Supabase-dashboard wijkt af van supabase/config.toml"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Zelfde reden als in controle.yml: de Node-versie staat in .nvmrc en
          # package-lock.json is door npm 11 geschreven.
          node-version-file: .nvmrc
          cache: npm

      # De Supabase-CLI zit als devDependency in package-lock.json. Via `npm ci`
      # draait deze controle met precies dezelfde versie als op je eigen
      # computer, in plaats van met wat `npx supabase@latest` die dag ophaalt.
      - name: Pakketten installeren
        run: npm ci

      # Zonder sleutel kan de CLI het echte project niet bereiken. Dan stopt de
      # controle met uitleg in plaats van met een foutmelding waar niemand iets
      # aan heeft.
      - name: Kijken of de sleutel er is
        id: sleutel
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::Het geheim SUPABASE_ACCESS_TOKEN staat niet in GitHub → Settings → Secrets. Zonder die sleutel kan deze controle het dashboard niet bekijken."
            echo "Deze controle is overgeslagen: het geheim \`SUPABASE_ACCESS_TOKEN\` ontbreekt." >> "$GITHUB_STEP_SUMMARY"
            echo "draaien=nee" >> "$GITHUB_OUTPUT"
          else
            echo "draaien=ja" >> "$GITHUB_OUTPUT"
          fi

      # Welk project bekeken wordt, staat in supabase/config.toml onder
      # [remotes.productie]. Zo staat het projectnummer op één plek en kan het
      # hier niet achterlopen.
      - name: Welk project
        id: project
        if: ${{ steps.sleutel.outputs.draaien == 'ja' }}
        run: |
          set -euo pipefail
          ref=$(awk '
            /^\[remotes\.productie\]/ { in_blok = 1; next }
            /^\[/ { in_blok = 0 }
            in_blok && /^[[:space:]]*project_id[[:space:]]*=/ {
              gsub(/^[^=]*=[[:space:]]*"?|"?[[:space:]]*$/, "")
              print
              exit
            }
          ' supabase/config.toml)
          if [ -z "$ref" ]; then
            echo "::error::Geen [remotes.productie] met project_id gevonden in supabase/config.toml."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Verschil opzoeken
        id: verschil
        if: ${{ steps.sleutel.outputs.draaien == 'ja' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.project.outputs.ref }}
        run: |
          set -uo pipefail

          # --exit-code: 0 als alles gelijk is, 2 als er verschil is, 1 bij een
          # echte fout (sleutel verlopen, Supabase onbereikbaar).
          uitvoer=$(npx supabase config diff --project-ref "$REF" --exit-code 2>&1)
          code=$?

          # Deze repo is openbaar, en dat geldt ook voor het logboek van deze
          # run. Wat uit het dashboard komt, kan een e-mailadres of een
          # SMTP-gebruikersnaam bevatten. Die halen we eruit voordat er iets
          # wordt opgeschreven; wie het verschil precies moet zien, draait
          # `npx supabase config diff` zelf.
          uitvoer=$(printf '%s\n' "$uitvoer" | sed -E \
            -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mailadres weggelaten>/g' \
            -e 's/^([[:space:]]*[+-]?[[:space:]]*(pass|password|user|username|api_key|secret|token|key)[[:space:]]*=).*/\1 <weggelaten>/')

          # Een scheidingsregel die niet in de uitvoer kan voorkomen; anders
          # kan een regel uit het verschil de rest afkappen.
          einde="EINDE-$(openssl rand -hex 16)"
          {
            echo "uitvoer<<$einde"
            printf '%s\n' "$uitvoer"
            echo "$einde"
          } >> "$GITHUB_OUTPUT"

          case "$code" in
            0)
              echo "verschil=nee" >> "$GITHUB_OUTPUT"
              echo "Het dashboard zegt hetzelfde als \`supabase/config.toml\`." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "verschil=ja" >> "$GITHUB_OUTPUT"
              # Een waarschuwing, geen rood. Rood hier zou elke ochtend een
              # mislukte run opleveren voor iets wat niemand vandaag kapot
              # gemaakt heeft.
              echo "::warning::Het Supabase-dashboard wijkt af van supabase/config.toml. Zie de melding in Issues."
              {
                echo "## Het dashboard wijkt af van \`supabase/config.toml\`"
                echo
                echo '```diff'
                printf '%s\n' "$uitvoer"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # Hier wél rood: een controle die stilletjes niets doet, is erger
              # dan geen controle. Zo krijgt Aaf een mail van GitHub.
              echo "::error::Het vergelijken zelf ging mis (afsluitcode $code)."
              printf '%s\n' "$uitvoer"
              exit 1
              ;;
          esac

      # Een waarschuwing in een logboek leest niemand. Bij verschil komt er
      # daarom een issue in de repo; die stuurt GitHub wél door. Staat hij er
      # al, dan wordt alleen de tekst bijgewerkt — dat geeft geen nieuwe
      # melding en voorkomt elke ochtend hetzelfde bericht.
      - name: Melding openen of bijwerken
        if: ${{ steps.verschil.outputs.verschil == 'ja' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UITVOER: ${{ steps.verschil.outputs.uitvoer }}
        run: |
          set -euo pipefail

          {
            echo "Deze melding is automatisch gemaakt door de workflow **Dashboard vergelijken**."
            echo
            echo "Het Supabase-dashboard en \`supabase/config.toml\` zeggen niet meer hetzelfde."
            echo "Zolang dat zo is, klopt wat je in de repo leest niet met wat een leerling merkt."
            echo
            echo "Wat je ziet (e-mailadressen en wachtwoorden zijn eruit gehaald, want deze repo is openbaar):"
            echo
            echo '```diff'
            printf '%s\n' "$UITVOER"
            echo '```'
            echo
            echo "Het hele verschil zie je met \`npx supabase config diff\` op je eigen computer."
            echo
            echo "Twee manieren om het weer gelijk te trekken:"
            echo
            echo "* klopt het dashboard en de repo niet → pas \`supabase/config.toml\` aan;"
            echo "* klopt de repo en het dashboard niet → zet het in het dashboard goed."
            echo
            echo "> Deze controle doet zelf **nooit** \`supabase config push\`: dat project draagt de echte accounts en voortgang van leerlingen."
            echo
            echo "Laatste controle: [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > melding.md

          nummer=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITEL)][0].number // empty')

          if [ -n "$nummer" ]; then
            echo "Melding #$nummer staat al open; alleen de tekst bijwerken."
            gh issue edit "$nummer" --body-file melding.md
          else
            gh issue create --title "$TITEL" --body-file melding.md
          fi

      # Is het verschil weg, dan hoeft de melding er niet te blijven staan.
      - name: Melding sluiten als het verschil weg is
        if: ${{ steps.verschil.outputs.verschil == 'nee' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nummer=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITEL)][0].number // empty')
          if [ -n "$nummer" ]; then
            gh issue close "$nummer" \
              --comment "Het dashboard en \`supabase/config.toml\` zeggen weer hetzelfde. Automatisch gesloten."
          fi
