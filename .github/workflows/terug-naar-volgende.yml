# Na elke push op `main`: zorgen dat `volgende` die ook heeft.
#
# Komt de push uit de dagelijkse release, dan schuift `volgende` gewoon door
# en verandert er inhoudelijk niets. Ging er een kritieke fix rechtstreeks
# naar `main`, dan wordt die hier teruggehaald — anders staat hij niet op de
# voorbeeldversie en mist elke nieuwe tak hem.
#
# Botst het, dan komt er een melding in Issues en blijft de run groen: rood
# op `main` zegt niets over de commit die net gemerged is.
#
# Deze workflow duwt rechtstreeks naar `volgende`. Dat kan via de deploy-key
# `terug-naar-volgende (workflow)`, die als enige uitzondering in de ruleset
# "volgende beschermen" staat. Waarom geen GITHUB_TOKEN: GitHub laat de app
# GitHub Actions alleen in een organisatie als uitzondering toe, en deze repo
# staat op een persoonlijk account. Een push met GITHUB_TOKEN start boven-
# dien geen workflows, dus de verplichte controles zouden dan ontbreken op de
# nieuwe kop van `volgende` en de release-pull-request zou niet te mergen
# zijn. Met de sleutel draait `controle.yml` wél gewoon.
#
# Weg ermee? Verwijder de deploy-key, het geheim
# TERUG_NAAR_VOLGENDE_SLEUTEL en de uitzondering in de ruleset.
name: Terug naar volgende

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terug-naar-volgende
  cancel-in-progress: false

jobs:
  terug:
    name: Terug naar volgende
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Zonder de sleutel kan deze workflow niet duwen. Dan stopt hij met
      # uitleg in plaats van halverwege om te vallen.
      - name: Kijken of de sleutel er is
        id: sleutel
        env:
          SLEUTEL: ${{ secrets.TERUG_NAAR_VOLGENDE_SLEUTEL }}
        run: |
          if [ -z "$SLEUTEL" ]; then
            echo "er=nee" >> "$GITHUB_OUTPUT"
            echo "::warning::Het geheim TERUG_NAAR_VOLGENDE_SLEUTEL staat niet in GitHub. Zonder die deploy-key kan main niet automatisch terug in volgende."
            echo "Het geheim \`TERUG_NAAR_VOLGENDE_SLEUTEL\` ontbreekt; deze controle slaat zichzelf over." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "er=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.sleutel.outputs.er == 'ja' }}
        with:
          fetch-depth: 0
          # Zet de deploy-key klaar en laat git via SSH praten, zodat de push
          # van de sleutel komt en niet van GITHUB_TOKEN.
          ssh-key: ${{ secrets.TERUG_NAAR_VOLGENDE_SLEUTEL }}

      - name: Main in volgende samenvoegen
        if: ${{ steps.sleutel.outputs.er == 'ja' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/terug-naar-volgende.sh
