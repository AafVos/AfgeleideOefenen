# Beveiligingsupdates van Dependabot automatisch mergen zodra alle verplichte
# controles groen zijn. Grote versiesprongen (semver-major) niet: die kunnen
# iets breken en krijgen een ticket bij de Ontwikkelaar (Pro).
name: Dependabot automatisch mergen

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  samenvoegen:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Soort update bepalen
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Automatisch mergen na groene controles
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
